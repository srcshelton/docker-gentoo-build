name: Validate Gentoo container builds

on:
  pull_request:
    paths:
      - ".github/build-state.sh"
      - ".github/cpu-diagnostics.sh"
      - ".github/pkgcache.sh"
      - ".github/workflows/gentoo-build.yml"
      - "common/**"
      - "gentoo-base/**"
      - "gentoo-init.docker"
      - "tools/**"
  push:
    branches:
      - master
    paths:
      - ".github/build-state.sh"
      - ".github/cpu-diagnostics.sh"
      - ".github/pkgcache.sh"
      - ".github/workflows/gentoo-build.yml"
      - "common/**"
      - "gentoo-base/**"
      - "gentoo-init.docker"
      - "tools/**"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      restore_pkgdir_cache:
        description: "Restore a previous Portage PKGDIR cache before building"
        required: false
        type: boolean
        default: true
      save_pkgdir_cache:
        description: "Save the resulting Portage PKGDIR as a new workflow cache"
        required: false
        type: boolean
        default: true
      upload_image:
        description: "Upload each compressed gentoo-build image (may exceed the account's artifact-storage allowance)"
        required: false
        type: boolean
        default: false
      upload_pkgdir:
        description: "Upload each compressed Portage PKGDIR (normally exceeds the free artifact-storage allowance)"
        required: false
        type: boolean
        default: false

concurrency:
  group: gentoo-container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Preflight ${{ matrix.arch }} Docker path
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' script; do
            if head -n 1 "${script}" | grep -Fq bash; then
              bash -n "${script}"
            fi
          done < <(git ls-files -z '*.docker' '*.sh')

      - name: Probe Docker integration
        shell: bash
        env:
          CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail

          docker version
          test "$(docker info --format '{{.Architecture}}')" = "$(uname -m)"
          probe_status=0
          probe_output="$(./gentoo-init.docker --help 2>&1)" || probe_status=${?}
          printf '%s\n' "${probe_output}"
          if grep -Fq \
              'has no safe named build target' \
              <<<"${probe_output}"
          then
            if ! .github/cpu-diagnostics.sh; then
              echo '::warning::Unable to collect optional CPU diagnostics'
            fi
          fi
          (( probe_status == 0 )) || exit "${probe_status}"

  build:
    name: Build gentoo-build on ${{ matrix.arch }}
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out srcshelton overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: srcshelton/gentoo-ebuilds
          path: .ci-repos/srcshelton

      - name: Resolve successful-build fingerprint
        id: build-state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ".ci-state/success-${{ matrix.arch }}"
          state="$(.github/build-state.sh fingerprint \
            "${{ matrix.arch }}" .ci-repos/srcshelton)"
          printf '%s\n' "${state}"
          {
            echo "### ${{ matrix.arch }} build-source fingerprint"
            echo
            echo '```text'
            printf '%s\n' "${state}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Look up a successful identical build
        id: build-success
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-state/success-${{ matrix.arch }}
          key: ${{ steps.build-state.outputs.success-key }}
          lookup-only: true

      - name: Decide whether to build
        id: build-decision
        shell: bash
        run: |
          set -euo pipefail

          build=true
          reason='pushes and manually dispatched runs always validate the requested source'
          if [[ "${{ github.event_name }}" == 'schedule' ]]; then
            if [[ "${{ steps.build-success.outputs.cache-hit }}" == 'true' ]]; then
              build=false
              reason='an identical source, overlay, Portage pin and stage3 digest already completed successfully'
            else
              reason='no successful build marker matches the current scheduled inputs'
            fi
          fi
          printf 'build=%s\nreason=%s\n' "${build}" "${reason}" >> "${GITHUB_OUTPUT}"
          printf 'Build: %s (%s)\n' "${build}" "${reason}"
          {
            echo
            echo "- Build required: \`${build}\`"
            echo "- Reason: ${reason}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reclaim runner disk space
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Resolve pinned Gentoo repository commit
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        id: portage-ref
        shell: bash
        run: |
          set -euo pipefail

          commit="$(grep -Fv '#' .ci-repos/srcshelton/.portage_commit | head -n 1)"
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The overlay does not declare a valid Portage commit"
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned Gentoo repository
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gentoo/gentoo
          ref: ${{ steps.portage-ref.outputs.commit }}
          path: .ci-repos/gentoo

      - name: Prepare host paths
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /var/db/repo /var/cache/portage/pkg \
            /var/cache/portage/pkg-seed \
            /var/cache/portage/dist /var/log/portage
          sudo chown -R "$(id -u):$(id -g)" \
            /var/cache/portage /var/log/portage
          sudo ln -sfn "${GITHUB_WORKSPACE}/.ci-repos/gentoo" \
            /var/db/repo/gentoo
          sudo ln -sfn "${GITHUB_WORKSPACE}/.ci-repos/srcshelton" \
            /var/db/repo/srcshelton

      - name: Resolve binary-package generation affinity
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        id: pkg-identity
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          GENTOO_PKGHOST: github-actions
        run: |
          set -euo pipefail

          lscpu
          grep -E \
            '^(vendor_id|model name|flags|CPU implementer|CPU architecture|CPU part|CPU revision|Features)[[:space:]]*:' \
            /proc/cpuinfo | sort -u
          identity="$(.github/pkgcache.sh identity)"
          printf '%s\n' "${identity}"
          {
            echo "### ${{ matrix.arch }} binary-package generation affinity"
            echo
            echo '```text'
            printf '%s\n' "${identity}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore Portage binary-package cache
        if: ${{ steps.build-decision.outputs.build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.restore_pkgdir_cache) }}
        id: pkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/portage/pkg-seed
          key: gentoo-pkgdir-v${{ steps.pkg-identity.outputs.schema }}-${{ steps.pkg-identity.outputs.label }}-${{ steps.portage-ref.outputs.commit }}-${{ github.run_id }}
          restore-keys: |
            gentoo-pkgdir-v${{ steps.pkg-identity.outputs.schema }}-${{ steps.pkg-identity.outputs.label }}-${{ steps.portage-ref.outputs.commit }}-
            gentoo-pkgdir-v${{ steps.pkg-identity.outputs.schema }}-${{ steps.pkg-identity.outputs.label }}-

      - name: Build target image
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          GENTOO_PKGHOST: github-actions
          JOBS: "4"
          MAXLOAD: "5"
        run: |
          set -euo pipefail

          df -h /
          docker info
          ./gentoo-init.docker

      - name: Validate target image
        if: ${{ steps.build-decision.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect localhost/gentoo-build:latest
          docker run --rm --entrypoint /bin/sh \
            localhost/gentoo-build:latest -c \
            'test -x /usr/bin/emerge && test -x /usr/bin/portageq'
          {
            echo "### ${{ matrix.arch }} Gentoo build result"
            echo
            echo "- Image: \`localhost/gentoo-build:latest\`"
            echo "- Generation-affinity label: \`${{ steps.pkg-identity.outputs.label }}\`"
            echo "- Uncompressed image bytes: \`$(docker image inspect \
              --format '{{.Size}}' localhost/gentoo-build:latest)\`"
            echo "- Previous-generation bytes: \`$(du -sb /var/cache/portage/pkg-seed | cut -f1)\`"
            echo "- New-generation bytes: \`$(du -sb /var/cache/portage/pkg | cut -f1)\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Normalize cache ownership
        if: ${{ always() && steps.build-decision.outputs.build == 'true' }}
        shell: bash
        run: |
          .github/pkgcache.sh normalize-ownership

      - name: Export target image
        if: ${{ success() && steps.build-decision.outputs.build == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_image }}
        shell: bash
        run: |
          set -euo pipefail

          docker save localhost/gentoo-build:latest |
            zstd -T0 -10 -o "${RUNNER_TEMP}/gentoo-build-${{ steps.pkg-identity.outputs.label }}.tar.zst"

      - name: Upload target image
        if: ${{ success() && steps.build-decision.outputs.build == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_image }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gentoo-build-${{ steps.pkg-identity.outputs.label }}
          path: ${{ runner.temp }}/gentoo-build-${{ steps.pkg-identity.outputs.label }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Export Portage PKGDIR
        if: ${{ success() && steps.build-decision.outputs.build == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_pkgdir }}
        shell: bash
        run: |
          set -euo pipefail

          tar --zstd -cf "${RUNNER_TEMP}/gentoo-pkgdir-${{ steps.pkg-identity.outputs.label }}.tar.zst" \
            -C /var/cache/portage pkg

      - name: Upload Portage PKGDIR
        if: ${{ success() && steps.build-decision.outputs.build == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_pkgdir }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gentoo-pkgdir-${{ steps.pkg-identity.outputs.label }}
          path: ${{ runner.temp }}/gentoo-pkgdir-${{ steps.pkg-identity.outputs.label }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Stage new binary-package generation for cache save
        id: stage-pkg-cache
        if: ${{ always() && steps.build-decision.outputs.build == 'true' && steps.pkg-identity.outputs.label != '' && (github.event_name != 'workflow_dispatch' || inputs.save_pkgdir_cache) }}
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          GENTOO_PKGHOST: github-actions
        run: |
          set -euo pipefail

          .github/pkgcache.sh stage-save

      - name: Save Portage binary-package cache
        if: ${{ always() && steps.stage-pkg-cache.outputs.ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/portage/pkg-seed
          key: gentoo-pkgdir-v${{ steps.pkg-identity.outputs.schema }}-${{ steps.pkg-identity.outputs.label }}-${{ steps.portage-ref.outputs.commit }}-${{ github.run_id }}

      - name: Record successful build inputs
        if: ${{ success() && steps.build-decision.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            "fingerprint=${{ steps.build-state.outputs.fingerprint }}" \
            "repository=${GITHUB_SHA}" \
            "overlay=$(git -C .ci-repos/srcshelton rev-parse HEAD)" \
            "portage=${{ steps.portage-ref.outputs.commit }}" \
            "stage3=${{ steps.build-state.outputs.stage3-digest }}" \
            > ".ci-state/success-${{ matrix.arch }}/inputs"

      - name: Save successful-build marker
        if: ${{ success() && steps.build-decision.outputs.build == 'true' && steps.build-success.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-state/success-${{ matrix.arch }}
          key: ${{ steps.build-state.outputs.success-key }}
